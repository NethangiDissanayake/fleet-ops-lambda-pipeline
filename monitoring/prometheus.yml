global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: stream-producer      # ingestion (streaming source)
    static_configs: [{targets: ["stream-producer:8001"]}]
  - job_name: batch-producer       # ingestion (daily-batch source)
    static_configs: [{targets: ["batch-producer:8002"]}]
  - job_name: spark-streaming      # processing (speed layer)
    static_configs: [{targets: ["spark-streaming:8003"]}]
  - job_name: api                  # serving layer + pipeline state read from PostgreSQL
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
