apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Fleet DB
    uid: fleet-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: fleet
    secureJsonData:
      password: fleet
    jsonData:
      database: fleet
      sslmode: disable
      postgresVersion: 1600
