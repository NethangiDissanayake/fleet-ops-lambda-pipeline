<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="1500" height="900" fill="#f8fafc"/>
<text x="30" y="36" font-size="22" font-weight="800" fill="#0f172a">Fleet Operations Pipeline - Lambda Architecture</text>
<text x="30" y="58" font-size="13" fill="#475569">1 simulated day = 5 real minutes  |  30 vehicles  |  all components run as Docker Compose services</text>
<rect x="20" y="80" width="230" height="500" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="34" y="102" font-size="14" font-weight="800" fill="#1d4ed8">1  DATA SOURCES (simulated)</text>
<rect x="270" y="80" width="250" height="500" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="284" y="102" font-size="14" font-weight="800" fill="#15803d">2  INGESTION</text>
<rect x="540" y="80" width="470" height="250" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="554" y="102" font-size="14" font-weight="800" fill="#c2410c">3a  SPEED LAYER (real time)</text>
<rect x="540" y="350" width="470" height="230" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="554" y="372" font-size="14" font-weight="800" fill="#7e22ce">3b  BATCH LAYER (once per simulated day)</text>
<rect x="1030" y="80" width="450" height="500" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="1044" y="102" font-size="14" font-weight="800" fill="#a16207">4  SERVING LAYER</text>
<rect x="20" y="610" width="1460" height="270" rx="14" fill="#f1f5f9" stroke="#0f766e" stroke-width="1.5"/>
<text x="34" y="632" font-size="14" font-weight="800" fill="#0f766e">5  OBSERVABILITY</text>
<rect x="40" y="130" width="190" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="135.0" y="152" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Streaming source</text>
<text x="135.0" y="172" text-anchor="middle" font-size="12" fill="#334155">stream_producer.py</text>
<text x="135.0" y="188" text-anchor="middle" font-size="12" fill="#334155">GPS/telemetry per vehicle</text>
<text x="135.0" y="204" text-anchor="middle" font-size="12" fill="#334155">every 2 s (~15 events/s)</text>
<text x="135.0" y="220" text-anchor="middle" font-size="12" fill="#334155">+1% bad, +0.5% duplicate</text>
<rect x="40" y="400" width="190" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="135.0" y="422" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Daily-batch source</text>
<text x="135.0" y="442" text-anchor="middle" font-size="12" fill="#334155">batch_producer.py</text>
<text x="135.0" y="458" text-anchor="middle" font-size="12" fill="#334155">1 CSV per simulated day</text>
<text x="135.0" y="474" text-anchor="middle" font-size="12" fill="#334155">fuel + maintenance costs</text>
<text x="135.0" y="490" text-anchor="middle" font-size="12" fill="#334155">6% dirty rows</text>
<rect x="290" y="130" width="210" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="395.0" y="152" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Apache Kafka (KRaft)</text>
<text x="395.0" y="172" text-anchor="middle" font-size="12" fill="#334155">topic: trip-events</text>
<text x="395.0" y="188" text-anchor="middle" font-size="12" fill="#334155">3 partitions, key = vehicle_id</text>
<text x="395.0" y="204" text-anchor="middle" font-size="12" fill="#334155">acks=all, at-least-once</text>
<rect x="290" y="400" width="210" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="395.0" y="422" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Landing zone</text>
<text x="395.0" y="442" text-anchor="middle" font-size="12" fill="#334155">/data/landing/</text>
<text x="395.0" y="458" text-anchor="middle" font-size="12" fill="#334155">expenses_YYYY-MM-DD.csv</text>
<text x="395.0" y="474" text-anchor="middle" font-size="12" fill="#334155">atomic rename (.tmp -> .csv)</text>
<rect x="560" y="125" width="200" height="190" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
<text x="660.0" y="147" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Spark Structured Streaming</text>
<text x="660.0" y="167" text-anchor="middle" font-size="12" fill="#334155">10 s micro-batches</text>
<text x="660.0" y="183" text-anchor="middle" font-size="12" fill="#334155">parse + validate (reject_reason)</text>
<text x="660.0" y="199" text-anchor="middle" font-size="12" fill="#334155">watermark 2 min + dedup</text>
<text x="660.0" y="215" text-anchor="middle" font-size="12" fill="#334155">enrich: zone, sim date/hour</text>
<text x="660.0" y="231" text-anchor="middle" font-size="12" fill="#334155">1-min windows per zone</text>
<text x="660.0" y="247" text-anchor="middle" font-size="12" fill="#334155">idle-since tracking + alerts</text>
<rect x="790" y="235" width="200" height="80" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
<text x="890.0" y="257" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Parquet master dataset</text>
<text x="890.0" y="277" text-anchor="middle" font-size="12" fill="#334155">/data/lake/trip_events</text>
<text x="890.0" y="293" text-anchor="middle" font-size="12" fill="#334155">immutable, replayable</text>
<rect x="790" y="125" width="200" height="90" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
<text x="890.0" y="147" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">PostgreSQL speed views</text>
<text x="890.0" y="167" text-anchor="middle" font-size="12" fill="#334155">zone_metrics_1m, zone_hourly</text>
<text x="890.0" y="183" text-anchor="middle" font-size="12" fill="#334155">vehicle_state, alerts</text>
<text x="890.0" y="199" text-anchor="middle" font-size="12" fill="#334155">idempotent txn (batch ledger)</text>
<rect x="560" y="395" width="200" height="165" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/>
<text x="660.0" y="417" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Apache Airflow DAG</text>
<text x="660.0" y="437" text-anchor="middle" font-size="12" fill="#334155">schedule */5 min</text>
<text x="660.0" y="453" text-anchor="middle" font-size="12" fill="#334155">find_pending_days</text>
<text x="660.0" y="469" text-anchor="middle" font-size="12" fill="#334155">ingest_expenses (clean)</text>
<text x="660.0" y="485" text-anchor="middle" font-size="12" fill="#334155">recompute_batch_view</text>
<text x="660.0" y="501" text-anchor="middle" font-size="12" fill="#334155">reconcile_profitability</text>
<text x="660.0" y="517" text-anchor="middle" font-size="12" fill="#334155">publish_report</text>
<rect x="790" y="395" width="200" height="75" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/>
<text x="890.0" y="417" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Batch view</text>
<text x="890.0" y="437" text-anchor="middle" font-size="12" fill="#334155">earnings recomputed from</text>
<text x="890.0" y="453" text-anchor="middle" font-size="12" fill="#334155">Parquet (authoritative)</text>
<rect x="790" y="485" width="200" height="75" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/>
<text x="890.0" y="507" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">PostgreSQL batch tables</text>
<text x="890.0" y="527" text-anchor="middle" font-size="12" fill="#334155">expenses_clean/rejected</text>
<text x="890.0" y="543" text-anchor="middle" font-size="12" fill="#334155">daily_profitability, reports</text>
<rect x="1050" y="125" width="410" height="170" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
<text x="1255.0" y="147" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">PostgreSQL  (serving store)</text>
<text x="1255.0" y="167" text-anchor="middle" font-size="12" fill="#334155">speed views  +  batch views  +  audit tables</text>
<text x="1255.0" y="183" text-anchor="middle" font-size="12" fill="#334155"></text>
<text x="1255.0" y="199" text-anchor="middle" font-size="12" fill="#334155">Real-time: zone_metrics_1m, zone_hourly, vehicle_state, alerts</text>
<text x="1255.0" y="215" text-anchor="middle" font-size="12" fill="#334155">Batch: daily_profitability, daily_reports, batch_runs</text>
<text x="1255.0" y="231" text-anchor="middle" font-size="12" fill="#334155">Reliability: processed_batches ledger, pipeline_stats</text>
<rect x="1050" y="330" width="195" height="200" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
<text x="1147.5" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">FastAPI</text>
<text x="1147.5" y="372" text-anchor="middle" font-size="12" fill="#334155">/metrics/utilization</text>
<text x="1147.5" y="388" text-anchor="middle" font-size="12" fill="#334155">/metrics/time-of-day</text>
<text x="1147.5" y="404" text-anchor="middle" font-size="12" fill="#334155">/alerts  /vehicles</text>
<text x="1147.5" y="420" text-anchor="middle" font-size="12" fill="#334155">/report/profitability</text>
<text x="1147.5" y="436" text-anchor="middle" font-size="12" fill="#334155">/health  /metrics</text>
<text x="1147.5" y="452" text-anchor="middle" font-size="12" fill="#334155">/docs (Swagger)</text>
<rect x="1265" y="330" width="195" height="95" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
<text x="1362.5" y="352" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Grafana dashboard</text>
<text x="1362.5" y="372" text-anchor="middle" font-size="12" fill="#334155">live KPIs, zone earnings,</text>
<text x="1362.5" y="388" text-anchor="middle" font-size="12" fill="#334155">alerts, pipeline health</text>
<rect x="1265" y="440" width="195" height="90" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
<text x="1362.5" y="462" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Daily report</text>
<text x="1362.5" y="482" text-anchor="middle" font-size="12" fill="#334155">HTML + CSV per sim day</text>
<text x="1362.5" y="498" text-anchor="middle" font-size="12" fill="#334155">./reports and API</text>
<rect x="40" y="650" width="300" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
<text x="190.0" y="672" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Structured JSON logs</text>
<text x="190.0" y="692" text-anchor="middle" font-size="12" fill="#334155">service + stage on every line</text>
<text x="190.0" y="708" text-anchor="middle" font-size="12" fill="#334155">ingestion | processing | storage |</text>
<text x="190.0" y="724" text-anchor="middle" font-size="12" fill="#334155">orchestration | serving</text>
<rect x="370" y="650" width="330" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
<text x="535.0" y="672" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Prometheus metrics (scrape 5 s)</text>
<text x="535.0" y="692" text-anchor="middle" font-size="12" fill="#334155">producers :8001 :8002   Spark :8003</text>
<text x="535.0" y="708" text-anchor="middle" font-size="12" fill="#334155">API :8000/metrics (pipeline state from DB)</text>
<text x="535.0" y="724" text-anchor="middle" font-size="12" fill="#334155">events/s, invalid rate, batch time, freshness</text>
<rect x="730" y="650" width="340" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
<text x="900.0" y="672" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Alert rules (Prometheus)</text>
<text x="900.0" y="692" text-anchor="middle" font-size="12" fill="#334155">NoEventsProcessed  >2 min</text>
<text x="900.0" y="708" text-anchor="middle" font-size="12" fill="#334155">HighInvalidEventRate  >5 %</text>
<text x="900.0" y="724" text-anchor="middle" font-size="12" fill="#334155">SparkBatchFailed, BatchLayerStale,</text>
<text x="900.0" y="740" text-anchor="middle" font-size="12" fill="#334155">BatchRunFailed, IdleVehiclesDetected</text>
<rect x="1100" y="650" width="360" height="100" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
<text x="1280.0" y="672" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">Health checks + business alerts</text>
<text x="1280.0" y="692" text-anchor="middle" font-size="12" fill="#334155">GET /health  (503 when no data > 120 s)</text>
<text x="1280.0" y="708" text-anchor="middle" font-size="12" fill="#334155">idle vehicle > 60 s -> alerts table</text>
<text x="1280.0" y="724" text-anchor="middle" font-size="12" fill="#334155">batch_runs audit trail per simulated day</text>
<text x="40" y="790" font-size="12" fill="#334155">Lambda: the speed layer answers "what is happening now" (seconds); the batch layer recomputes each finished day from the immutable Parquet</text>
<text x="40" y="808" font-size="12" fill="#334155">master dataset, joins it with the daily cost file and publishes the authoritative profitability report. Drift = batch earnings - speed-layer earnings is reported daily.</text>
<text x="40" y="838" font-size="12" fill="#334155">Grafana reads PostgreSQL (business panels) and Prometheus (pipeline health panels).</text>
